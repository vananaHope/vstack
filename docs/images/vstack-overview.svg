<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 518" width="1080" height="518" role="img" aria-labelledby="t d">
<title id="t">vstack이 요청을 처리하는 세 갈래</title>
<desc id="d">v-mode 라우터가 요청을 진행 중인 일인지, 크기, 작업 유형과 레시피 순으로 보고 세 갈래로 보낸다. 바로 갈래는 이 대화가 바로 처리한다. 한 세션 갈래는 레시피를 골라 이 대화가 직접 하거나 omp 작업자에게 맡기고, 수용 기준을 다시 돌려 확인한다. UI 다듬기 레시피는 맡기지 않고 직접 한다. 지휘 갈래는 정렬과 티켓, 작업자의 구현, 다른 계열의 교차 검토, 관리자의 증거 보관, 병합 관문을 차례로 거쳐 병합한다.</desc>
<style>
  svg { --bg:#FAFBFD; --ink:#18223A; --muted:#566379; --line:#CDD4E0; --line-strong:#9AA6BA; --base-bg:#DDE3EC;
        --user:#A35F00; --user-bg:#FBEACB; --craft:#0A7A72; --craft-bg:#D3EFEA; --run:#3F4FC2; --run-bg:#DFE3FB; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#182030; --ink:#E4E9F2; --muted:#9BA7BC; --line:#2C374C; --line-strong:#56637C; --base-bg:#232D41;
          --user:#F2B55A; --user-bg:#3A2B10; --craft:#56D3C7; --craft-bg:#10332F; --run:#A3AEFF; --run-bg:#212A56; }
  }
  text { font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; font-size: 12px; fill: var(--ink); }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, "SFMono-Regular", monospace; font-size: 10.5px; }
  .s { font-size: 12px; fill: var(--muted); }
  .b { font-weight: 600; }
  .h { font-size: 14px; font-weight: 700; }
  .inv { fill: var(--bg); }
  .invs { fill: var(--bg); font-size: 11px; opacity: .82; }
  .mid { text-anchor: middle; }
  .ln { stroke: var(--ink); stroke-width: 1.3; fill: none; }
  .mk { fill: var(--ink); }
  .bx { stroke-width: 1.3; }
  .u { fill: var(--user-bg); stroke: var(--user); }
  .c { fill: var(--craft-bg); stroke: var(--craft); }
  .r { fill: var(--run-bg); stroke: var(--run); }
  .d { fill: var(--bg); stroke: var(--ink); stroke-width: 1.6; }
  .ink { fill: var(--ink); }
  .base { fill: var(--base-bg); stroke: var(--ink); }
  .frame { fill: var(--bg); stroke: var(--line); }
  .sep { stroke: var(--line); stroke-width: 1; }
</style>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="frame" x="0.5" y="0.5" width="1079" height="517" rx="10"/>
<rect class="bx d" x="24" y="207" width="86" height="36" rx="4"/>
<text x="67" y="229" class="mid b">요청</text>
<path class="ln" d="M110 225H148" marker-end="url(#mk)"/>
<rect class="ink" x="150" y="120" width="170" height="210" rx="6"/>
<text x="166" y="148" class="h inv">v-mode</text>
<text x="166" y="165" class="invs">라우터</text>
<path d="M166 178H304" stroke="var(--bg)" stroke-opacity=".35"/>
<text x="166" y="202" class="inv">0  진행 중인 일인가</text>
<text x="166" y="222" class="inv">1  크기</text>
<text x="166" y="242" class="inv">2  작업 유형 · 레시피</text>
<text x="166" y="262" class="inv">3  갈래</text>
<text x="166" y="300" class="invs">주장마다 근거 표시</text>
<text x="166" y="316" class="invs">병합은 이름을 적은 승인</text>
