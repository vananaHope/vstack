<text x="394" y="62" class="mid b">바로</text>
<text x="394" y="86" class="mid s">질문 · 자명한 수정</text>
<text x="394" y="198" class="mid b">한 세션</text>
<text x="394" y="222" class="mid s">한 단위의 일</text>
<text x="394" y="364" class="mid b">지휘</text>
<text x="394" y="388" class="mid s">여러 티켓 · 관문</text>
<rect class="bx c" x="452" y="44" width="170" height="52" rx="4"/>
<text x="537" y="66" class="mid">이 대화가</text>
<text x="537" y="82" class="mid">바로 처리한다</text>
<text x="638" y="67" class="s">읽기 전용 질문과 조사, 한두 줄의 자명한 수정, 문서 수정.</text>
<text x="638" y="84" class="s">레시피 없이 후보 원칙만 쓴다.</text>
<path class="sep" d="M352 124H1056"/>
<rect class="bx d" x="452" y="170" width="170" height="72" rx="4"/>
