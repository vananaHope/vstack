<text x="950" y="368" class="mid b">병합 관문</text>
<text x="950" y="384" class="mid mono">G1 ~ G5</text>
<path class="ln" d="M552 372H562" marker-end="url(#mk)"/>
<path class="ln" d="M664 372H674" marker-end="url(#mk)"/>
