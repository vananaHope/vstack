<text x="920" y="218" class="mid">다시 돌려 확인한다</text>
<text x="452" y="276" class="s">계약 밖: 증거 폴더, 교차 검토, 병합 관문이 없다. push와 PR은 사용자가 지시할 때만 한다.</text>
<path class="sep" d="M352 300H1056"/>
<rect class="bx u" x="452" y="346" width="100" height="52" rx="4"/>
<text x="502" y="368" class="mid">정렬 · 티켓</text>
<text x="502" y="384" class="mid">vstack 절</text>
<rect class="bx c" x="564" y="346" width="100" height="52" rx="4"/>
<text x="614" y="368" class="mid">작업자가</text>
<text x="614" y="384" class="mid">레시피대로 구현</text>
<rect class="bx c" x="676" y="346" width="100" height="52" rx="4"/>
<text x="726" y="368" class="mid">다른 계열이</text>
<text x="726" y="384" class="mid">교차 검토</text>
<rect class="bx r" x="788" y="346" width="100" height="52" rx="4"/>
<text x="838" y="368" class="mid">관리자가</text>
<text x="838" y="384" class="mid">증거 보관</text>
