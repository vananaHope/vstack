<text x="537" y="210" class="mid mono">bug-fix · feature</text>
<text x="537" y="226" class="mid mono">refactoring · ui-polish</text>
<path class="ln" d="M622 206H636V173"/>
<path class="ln" d="M636 173H648" marker-end="url(#mk)"/>
<path class="ln" d="M636 206V229"/>
<path class="ln" d="M636 229H648" marker-end="url(#mk)"/>
<rect class="bx c" x="650" y="154" width="160" height="38" rx="4"/>
<text x="730" y="177" class="mid">이 대화가 직접 한다</text>
<rect class="bx c" x="650" y="206" width="160" height="46" rx="4"/>
<text x="730" y="225" class="mid">omp 작업자에게 맡긴다</text>
<text x="730" y="241" class="mid s">ui-polish는 맡기지 않는다</text>
<path class="ln" d="M810 173H824V229H810"/>
