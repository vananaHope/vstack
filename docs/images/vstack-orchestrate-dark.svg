        <title id="vstack-orchestrate-dark-title">지휘: 티켓에서 병합까지</title>
        <desc id="vstack-orchestrate-dark-desc">정렬과 티켓, 티켓의 vstack 절, 배정 전 검사, 등급별 작업자의 구현, 증거 보관, 다른 계열의 교차 검토와 판정(지금 고침이면 지적 수정 뒤 새 검토)을 거쳐 병합 관문 G1~G5를 모두 통과해야 squash 병합하고 정리한다.</desc>
