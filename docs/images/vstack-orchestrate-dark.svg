      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', 'AppleMyungjo', 'Batang', serif;
      --font-mono:     'Geist Mono', ui-monospace, 'SF Mono', Consolas, monospace; }
      #vstack-orchestrate-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #vstack-orchestrate-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#vstack-orchestrate-dark-root .diagram-container { overflow-x: visible; }
}</style>
