<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vstack-delegate-title vstack-delegate-desc" id="vstack-delegate-root">
        <title id="vstack-delegate-title">맡기기: 한 단위의 일을 맡기는 흐름</title>
        <desc id="vstack-delegate-desc">관리자가 명세와 수용 기준을 쓰고 새 worktree에 Claude 구현자를 띄우면, 관리자가 구현을 수용 기준으로 다시 확인하고 Codex 검토자가 같은 worktree에서 읽기 전용으로 검토하며, 고칠 것은 같은 구현자에게 최대 두 번 되돌린 뒤 관리자의 마지막 확인을 거쳐 반영한다.</desc>
        <defs>
      <style>#vstack-delegate-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', 'AppleMyungjo', 'Batang', serif;
      --font-mono:     'Geist Mono', ui-monospace, 'SF Mono', Consolas, monospace; }
      #vstack-delegate-root { font-family: var(--font-sans); color: var(--color-ink); }
      #vstack-delegate-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#vstack-delegate-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="vstack-delegate-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="vstack-delegate-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

