<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vstack-overview-dark-title vstack-overview-dark-desc" id="vstack-overview-dark-root">
        <title id="vstack-overview-dark-title">vstack이 요청을 처리하는 세 갈래</title>
        <desc id="vstack-overview-dark-desc">v-mode 라우터가 요청을 크기와 유형에 따라 바로, 맡기기, 지휘 세 갈래로 보내며, 관리자는 바로 갈래 말고는 제품 코드를 쓰지 않는다.</desc>
        <defs>
      <style>#vstack-overview-dark-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', 'AppleMyungjo', 'Batang', serif;
      --font-mono:     'Geist Mono', ui-monospace, 'SF Mono', Consolas, monospace; }
      #vstack-overview-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #vstack-overview-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#vstack-overview-dark-root .diagram-container { overflow-x: visible; }
}</style>
