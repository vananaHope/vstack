<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>맡기기: 한 단위의 일을 맡기는 흐름</title>
  <!-- Font source: system. No web-font link: the exported SVG is shown through <img>
       on GitHub, where web fonts cannot load. Stacks fall through to local faces. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', 'AppleMyungjo', 'Batang', serif;
      --font-mono:     'Geist Mono', ui-monospace, 'SF Mono', Consolas, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Diagram Design</p>
    <h1>맡기기: 한 단위의 일을 맡기는 흐름</h1>

    <div class="diagram-container">

        <rect x="564" y="136" width="120" height="16" rx="2" fill="#2d3142"/>

        <rect x="344" y="200" width="120" height="72" rx="6" fill="#2d3142"/>

        <rect x="648" y="200" width="120" height="72" rx="6" fill="#2d3142"/>
        <rect x="648" y="200" width="120" height="72" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2"/>
        <text x="708" y="240" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" text-anchor="middle">마지막 확인</text>
